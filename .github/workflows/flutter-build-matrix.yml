name: Flutter Build Matrix

# Release builds with code obfuscation for the platforms that can't be built
# inside this project's Linux-only dev sandbox: macOS, Windows, iOS. Android,
# Linux, and Web are included too so all 5 target platforms + web get built
# and uploaded as downloadable artifacts in one place.
#
# Requires these repo secrets (Settings > Secrets and variables > Actions):
#   SUPABASE_URL / SUPABASE_ANON_KEY -- baked in via --dart-define, same
#     values used for local `flutter run`. The anon key is safe to embed
#     (every table is RLS-protected) -- it's just kept as a secret here to
#     avoid hardcoding a specific project into a public workflow file.
#
# Known limitations of what this produces, on purpose (not a bug):
# - Android: no release keystore is configured, so the release APK is
#   signed with Flutter's default debug key (fine for sideloading/testing,
#   NOT acceptable for Play Store -- that needs a real upload keystore).
# - iOS: built with --no-codesign. The .app it produces cannot be installed
#   anywhere -- iOS requires a real Apple Developer signing identity and
#   provisioning profile, which isn't set up. This only proves the Dart/
#   Flutter/native-plugin side compiles cleanly for iOS.
# - macOS/Windows: unsigned. macOS in particular will trigger Gatekeeper
#   warnings on first launch without a Developer ID signature + notarization.
on:
  push:
    branches: [main]
    paths: ["app/**"]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.44.4"
  DART_DEFINES: --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: >
          flutter build apk --release
          --obfuscate --split-debug-info=build/symbols
          ${{ env.DART_DEFINES }}
      - uses: actions/upload-artifact@v5
        with:
          name: dailyclear-android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v5
        with:
          name: dailyclear-android-symbols
          path: app/build/symbols

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      # --obfuscate isn't supported for web (dart2js/dartdevc, not native AOT).
      - run: flutter build web ${{ env.DART_DEFINES }}
      - uses: actions/upload-artifact@v5
        with:
          name: dailyclear-web
          path: app/build/web

  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: >
          flutter build linux --release
          --obfuscate --split-debug-info=build/symbols
          ${{ env.DART_DEFINES }}
      - uses: actions/upload-artifact@v5
        with:
          name: dailyclear-linux
          path: app/build/linux/x64/release/bundle

  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: >
          flutter build macos --release
          --obfuscate --split-debug-info=build/symbols
          ${{ env.DART_DEFINES }}
      - uses: actions/upload-artifact@v5
        with:
          name: dailyclear-macos
          path: app/build/macos/Build/Products/Release/dailyclear.app

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: >
          flutter build windows --release
          --obfuscate --split-debug-info=build/symbols
          ${{ env.DART_DEFINES }}
      - uses: actions/upload-artifact@v5
        with:
          name: dailyclear-windows
          path: app/build/windows/x64/runner/Release

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      # No signing configured -- proves the Dart/Flutter/plugin side compiles
      # for iOS. Real device/TestFlight builds need an Apple Developer
      # account, provisioning profile, and signing certificate set up
      # separately (outside what CI alone can do).
      - run: >
          flutter build ios --release --no-codesign
          --obfuscate --split-debug-info=build/symbols
          ${{ env.DART_DEFINES }}
      - uses: actions/upload-artifact@v5
        with:
          name: dailyclear-ios-unsigned
          path: app/build/ios/iphoneos/Runner.app
